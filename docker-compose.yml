version: '3.8'

services:
  skygazer-ar:
    build:
      context: .
      dockerfile: Dockerfile
    image: skygazer-ar:latest
    container_name: skygazer-ar-unified
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
