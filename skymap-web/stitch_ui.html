<div id="threejs-container-ANIMATION_2" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0x404040, 2);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0x00f2ff, 5, 100);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Create Sun (Default Target)
const sunGeometry = new THREE.SphereGeometry(1, 64, 64);
const sunMaterial = new THREE.MeshPhongMaterial({
    color: 0xffcc33,
    emissive: 0xffaa00,
    emissiveIntensity: 0.5,
    shininess: 100
});
const sun = new THREE.Mesh(sunGeometry, sunMaterial);
scene.add(sun);

// HUD Ring (Tracking Indicator)
const ringGeo = new THREE.TorusGeometry(1.5, 0.02, 16, 100);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f2ff, transparent: true, opacity: 0.5 });
const ring = new THREE.Mesh(ringGeo, ringMat);
scene.add(ring);

camera.position.z = 4;

// Animation
function animate() {
    requestAnimationFrame(animate);
    sun.rotation.y += 0.005;
    ring.rotation.z += 0.01;
    ring.rotation.x += 0.005;
    
    // Slight float effect
    sun.position.y = Math.sin(Date.now() * 0.001) * 0.1;
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
});

animate();

})();
</script>
